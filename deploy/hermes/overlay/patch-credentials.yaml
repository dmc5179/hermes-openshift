apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  template:
    spec:
      containers:
        - name: hermes
          # envFrom has no merge key, so this list REPLACES the base's one
          # wholesale. Both entries must therefore be restated here.
          envFrom:
            - configMapRef:
                name: hermes-env
            - secretRef:
                # Created by deploy-hermes.sh, never committed. Holds:
                #   API_SERVER_KEY  the key Open WebUI presents to Hermes
                #   LLM_API_KEY     the key Hermes presents to its LLM endpoint
                name: hermes-credentials
          env:
            # Hermes reads its upstream credential from OPENAI_API_KEY on the
            # bare `provider: custom` path; model.key_env in config.yaml is NOT
            # consulted there. An empty value is fine for unauthenticated
            # endpoints -- Hermes then sends a placeholder key.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-credentials
                  key: LLM_API_KEY
