apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
# No RoleBinding, and none is needed. maas-api authorises the mint call through
# the MaaSSubscription's owner.groups, not through Kubernetes RBAC -- verified
# against this platform with a ServiceAccount carrying zero bindings.
#
# A dedicated account rather than the namespace `default` SA: it makes the
# identity legible in audit logs, and it means a future accessGroup narrowed to
# this specific account (rather than the whole namespace) needs no manifest
# change here. Either way this account is a member of
# system:serviceaccounts:hermes.
#
# automountServiceAccountToken is left at its default (true) deliberately. The
# auto-mounted token is a bound, kubelet-rotated token and maas-api accepts it
# as-is, so no explicit serviceAccountToken projection is required -- which also
# means there is no `audience` field present to be set wrongly. An explicit
# audience makes maas-api return 401 even though the API server itself accepts
# the token, so the safest projection is the one we do not write.
