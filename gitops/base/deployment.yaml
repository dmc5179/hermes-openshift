apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
spec:
  # Hard-pinned to 1. Hermes state is SQLite on a ReadWriteOnce PVC; a second
  # replica either cannot schedule or corrupts the database.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would try to run two pods
    # against one RWO volume and the new pod would block forever on attach.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: agent
    spec:
      # The pod's own identity, used to mint its MaaS key at startup. Its
      # auto-mounted token is what mint-and-exec.sh authenticates with.
      serviceAccountName: hermes-agent

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # No runAsUser / fsGroup: restricted-v2 assigns both from the namespace
        # annotations. The image's entrypoint-openshift.sh is written for an
        # arbitrary UID with GID 0.

      initContainers:
        # The image's entrypoint seeds $HERMES_HOME/config.yaml from its bundled
        # template ONLY when the file does not already exist -- and the file lives
        # on the PVC. Without this step the agent would come up pointing at
        # OpenRouter on first boot and then keep that stale config forever,
        # ignoring anything we later change in Git.
        #
        # Rendering the ConfigMap onto the volume on every start is what makes the
        # model configuration actually declarative: Argo CD owns the content, and
        # the configMapGenerator hash below forces a pod restart whenever it
        # changes.
        - name: render-config
          image: hermes-agent
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              install -m 0600 /config/config.yaml "${HERMES_HOME}/config.yaml"
              echo "rendered ${HERMES_HOME}/config.yaml from ConfigMap"
          env:
            - name: HERMES_HOME
              value: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: model-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      containers:
        - name: hermes
          image: hermes-agent
          imagePullPolicy: IfNotPresent

          # Wrapper entrypoint: mint a MaaS key with the pod's ServiceAccount
          # token, export it as OPENAI_API_KEY, then exec the image's real
          # entrypoint. See mint-and-exec.sh for why this cannot be an
          # initContainer -- the credential has to reach the process as an
          # environment variable, and only the process itself can set that.
          #
          # The script reproduces the image's own ENTRYPOINT and CMD, because
          # overriding `command` replaces both. `args` below supplies the CMD
          # half and is forwarded by the script's "$@".
          #
          # To roll back to the pre-minting behaviour, delete command/args and
          # the key reverts to the one in hermes-maas-credentials.
          command: ["/bin/bash", "/opt/hermes-bootstrap/mint-and-exec.sh"]
          args: ["gateway", "run"]

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: hermes-env
            - secretRef:
                # Created out of band, not managed by Argo CD. See
                # scripts/bootstrap-credentials.sh.
                name: hermes-maas-credentials

          env:
            # FALLBACK ONLY. mint-and-exec.sh overwrites OPENAI_API_KEY with a
            # freshly minted key before Hermes starts, so this value is not what
            # the agent ends up using. It is retained during the transition so
            # that deleting command/args from this container is a complete
            # rollback to the pre-minting behaviour. Remove it, and
            # MAAS_API_KEY from the Secret, in a separate commit once
            # self-minting has proven itself.
            #
            # The MaaS key, under the name this Hermes build actually reads.
            #
            # For a bare `provider: custom`, the image resolves its credential
            # from OPENAI_API_KEY (candidates are: explicit key, OPENAI_API_KEY,
            # OPENROUTER_API_KEY). A `model.key_env` field in config.yaml is NOT
            # consulted on this path -- key_env is only honoured inside a named
            # `providers:` entry. Setting it there and nowhere else yields a 401
            # from the gateway while plain curl from the same pod succeeds.
            #
            # Kept as a secretKeyRef rather than a config.yaml `model.api_key`,
            # because config.yaml is a ConfigMap and must not carry a credential.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-maas-credentials
                  key: MAAS_API_KEY

            # Make the MaaS gateway's serving certificate trustable. On a cluster
            # whose gateway uses the default ingress wildcard, that cert is signed
            # by the ingress operator's own CA, which is NOT in the system trust
            # store and NOT in the config.openshift.io/inject-trusted-cabundle
            # bundle either. Both vars are set because Hermes reaches the endpoint
            # through httpx (SSL_CERT_FILE) and requests (REQUESTS_CA_BUNDLE).
            - name: SSL_CERT_FILE
              value: /etc/hermes/maas-ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/hermes/maas-ca/ca-bundle.crt

          ports:
            - name: api
              containerPort: 8642
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: maas-ca
              mountPath: /etc/hermes/maas-ca
              readOnly: true
            - name: bootstrap
              mountPath: /opt/hermes-bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp

          # The API server binds 8642 (DEFAULT_PORT in the image's
          # gateway/platforms/api_server.py), not 8080, and it only binds at all
          # when API_SERVER_ENABLED is true -- which hermes-env sets.
          startupProbe:
            httpGet:
              path: /health
              port: api
            # Deliberately generous: this is a large image and first boot also
            # runs the bundled skills sync. failureThreshold x periodSeconds
            # allows ~5 minutes before the pod is declared failed.
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # No nvidia.com/gpu here, by design. Inference happens in MaaS; this pod
          # is a client. Requesting a GPU would make it unschedulable on a cluster
          # whose only GPU is already serving the model.

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: model-config
          configMap:
            name: hermes-model-config
        - name: maas-ca
          configMap:
            name: hermes-maas-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
            # Invoked as `bash <script>`, so the mode is not load-bearing; set
            # readable-and-executable anyway so the file is not surprising.
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
