apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-agent
  namespace: openshift-gitops
  # Standalone Application, deliberately NOT generated by an ApplicationSet.
  #
  # This Argo CD also runs AutoShift, whose `autoshift-policies` ApplicationSet
  # generates Applications named autoshift-<dir> from a git-files generator over
  # policies/*/*/kustomization.yaml in the autoshiftv2 repo. This Application
  # lives in a different repository and is named hermes-agent, so it falls
  # outside that generator entirely and the two cannot fight over resources.
  #
  # Do not move this file into the autoshiftv2 policies tree without deciding
  # that Hermes should become an AutoShift policy -- that is a distribution
  # decision with upstream-contribution consequences, not a packaging one. See
  # ../docs/followup-serviceaccount-key-minting.md for the related credential
  # discussion.
  # This finalizer makes deletion of the Application cascade to every resource
  # it manages -- including Namespace/hermes and the PVC, which is to say all of
  # Hermes' accumulated state.
  #
  # Measured 2026-10-19: when the AutoShift gitops-workloads policy adopts this
  # Application, ACM's mustonlyhave does NOT strip the finalizer, even though the
  # policy's own template omits it. Adoption preserves it. So the cascade risk
  # survives being brought under policy management, and the Prune=false
  # annotations on Namespace and PVC are the PRIMARY protection against data
  # loss here, not a secondary layer over a safer Application.
  #
  # Do not remove those annotations on the theory that the policy makes them
  # redundant. On this cluster it does not.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/dmc5179/hermes-openshift
    # The gitops/ tree lives on this branch; main does not have it yet. Change
    # to main once the branch merges, or Argo CD will fail with
    # "app path does not exist".
    targetRevision: maas-gitops
    path: gitops/overlays/rhoai-sandbox3587

  destination:
    server: https://kubernetes.default.svc
    namespace: hermes

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # the namespace is a managed resource in the overlay
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    # hermes-maas-credentials is created by scripts/bootstrap-credentials.sh and
    # holds a runtime-minted MaaS key. Argo CD must never prune it or try to
    # reconcile its contents.
    - group: ""
      kind: Secret
      name: hermes-maas-credentials
      jsonPointers:
        - /data
    # The CSI driver and the storage controller both write back to a bound PVC.
    - group: ""
      kind: PersistentVolumeClaim
      name: hermes-data
      jsonPointers:
        - /spec/volumeName
        - /spec/resources/requests/storage
