apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - ../../base

configMapGenerator:
  # Replace the base placeholder with this cluster's real MaaS binding.
  - name: hermes-model-config
    behavior: replace
    files:
      - config.yaml

  # Add this cluster's mint settings to the base env. merge, not replace: the
  # base values (API_SERVER_ENABLED and friends) must survive.
  - name: hermes-env
    behavior: merge
    envs:
      - hermes-maas.env

  # The MaaS gateway serves the default ingress wildcard certificate, signed by
  # the ingress operator's own CA. That CA is not publicly trusted and is not in
  # the bundle that config.openshift.io/inject-trusted-cabundle injects, so the
  # usual annotation does not help -- the cert has to be carried explicitly.
  #
  # ca-bundle.crt is a copy of openshift-config-managed/default-ingress-cert and
  # is regenerated by scripts/fetch-ingress-ca.sh. It is a public certificate,
  # not a secret, so committing it is fine. It expires 2028-10-16; re-run the
  # script after any ingress certificate rotation.
  - name: hermes-maas-ca
    files:
      - ca-bundle.crt

patches:
  - path: patch-pvc.yaml
  - path: patch-route.yaml
