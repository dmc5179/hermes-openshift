# Hermes model binding for the rhoai.sandbox3587 cluster (RHOAI 3.5.1, MaaS GA).
# Replaces base/config.yaml via configMapGenerator behavior: replace.

model:
  provider: "custom"

  # MaaS gateway (Gateway maas-default-gateway, gatewayClass openshift-default,
  # namespace openshift-ingress).
  #
  # NOT rh-ai.apps.rhoai.sandbox3587.opentlc.com -- that is data-science-gateway,
  # the RHOAI dashboard, which also lives in openshift-ingress and is easy to grab
  # by mistake.
  base_url: "https://maas.apps.rhoai.sandbox3587.opentlc.com/v1"

  # MUST be the fully-qualified publisher id, exactly as /v1/models reports it in
  # its "id" field -- NOT the bare name. Verified against this cluster:
  #
  #   "publishers/llm/models/granite-4-tiny-gpu"  -> HTTP 200
  #   "granite-4-tiny-gpu"                        -> HTTP 404
  #
  # Body-based routing works by the gateway deriving the header
  # X-Gateway-Model-Name: publishers/llm/models/granite-4-tiny-gpu from the
  # request body, and the HTTPRoute matches on that exact string. A bare name
  # matches no rule and falls through to a 404.
  #
  # Confusingly, the 200 response then echoes "model":"granite-4-tiny-gpu" (the
  # served name) -- so a successful response does not tell you what to send.
  # Always read the id from GET {base}/maas-api/v1/models.
  default: "publishers/llm/models/granite-4-tiny-gpu"

  # No api_key / key_env here on purpose.
  #
  # config.yaml is a ConfigMap, so it must not carry the credential. And a
  # `model.key_env` would be ignored anyway: on the bare `provider: custom` path
  # this build resolves its key from OPENAI_API_KEY, which the Deployment wires
  # from the hermes-maas-credentials Secret. key_env is only honoured inside a
  # named `providers:` entry.

database:
  journal_mode: "wal"
